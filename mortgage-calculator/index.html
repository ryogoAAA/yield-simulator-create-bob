<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>住宅ローン計算機</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      background: #f0f4f8;
      color: #1f2328;
      min-height: 100vh;
    }

    header {
      background: #1e3a5f;
      color: #fff;
      padding: 20px 24px;
      text-align: center;
    }
    header h1 { font-size: 22px; font-weight: 700; letter-spacing: 0.04em; }
    header p  { font-size: 13px; color: #a8c4e0; margin-top: 4px; }

    .container {
      max-width: 900px;
      margin: 32px auto;
      padding: 0 16px;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 24px;
    }
    @media (max-width: 700px) {
      .container { grid-template-columns: 1fr; }
    }

    /* ---- Card ---- */
    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 24px;
    }
    .card h2 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 20px;
      color: #1e3a5f;
      border-bottom: 2px solid #3b82d4;
      padding-bottom: 8px;
    }

    /* ---- Form ---- */
    .form-group { margin-bottom: 16px; }
    label {
      display: block;
      font-size: 13px;
      color: #57606a;
      margin-bottom: 4px;
      font-weight: 600;
    }
    .input-wrap {
      display: flex;
      align-items: center;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      overflow: hidden;
      transition: border-color .2s;
    }
    .input-wrap:focus-within { border-color: #3b82d4; box-shadow: 0 0 0 3px rgba(59,130,212,.15); }
    .input-wrap input {
      flex: 1;
      border: none;
      outline: none;
      padding: 9px 12px;
      font-size: 15px;
      background: transparent;
      min-width: 0;
    }
    .input-unit {
      padding: 9px 12px;
      background: #f7f8fa;
      color: #57606a;
      font-size: 13px;
      white-space: nowrap;
      border-left: 1px solid #d0d7de;
    }

    .repay-type {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .repay-type label {
      cursor: pointer;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: #57606a;
      transition: border-color .2s, color .2s, background .2s;
    }
    .repay-type input[type="radio"] { display: none; }
    .repay-type input[type="radio"]:checked + span {
      /* applied via JS on label */
    }
    .repay-type label.active {
      border-color: #3b82d4;
      color: #3b82d4;
      background: #eff6ff;
    }

    .section-divider {
      font-size: 12px;
      font-weight: 700;
      color: #57606a;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border-top: 1px solid #e5e7eb;
      padding-top: 16px;
      margin: 8px 0 16px;
    }

    .calc-btn {
      width: 100%;
      padding: 12px;
      background: #1e3a5f;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s;
      margin-top: 8px;
    }
    .calc-btn:hover { background: #2c5282; }

    /* ---- Right Panel ---- */
    .right-panel { display: flex; flex-direction: column; gap: 20px; }

    /* ---- Summary ---- */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 4px;
    }
    @media (max-width: 500px) { .summary-grid { grid-template-columns: 1fr 1fr; } }
    .summary-item {
      background: #f7f8fa;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 14px 12px;
      text-align: center;
      min-width: 0;
    }
    .summary-item .s-label { font-size: 11px; color: #57606a; }
    .summary-item .s-val {
      font-size: 18px;
      font-weight: 700;
      color: #1e3a5f;
      line-height: 1.3;
      margin-top: 4px;
      word-break: break-all;
    }
    @media (max-width: 400px) {
      .summary-grid { grid-template-columns: 1fr 1fr; }
      .summary-item .s-val { font-size: 15px; }
    }
    .summary-item .s-val span { font-size: 12px; font-weight: 500; }
    .summary-item.highlight { background: #eff6ff; border-color: #3b82d4; }
    .summary-item.highlight .s-val { color: #3b82d4; }

    /* ---- Donut Chart ---- */
    .chart-row {
      display: flex;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
    }
    @media (max-width: 400px) {
      .chart-row { justify-content: center; }
    }
    .donut-wrap { position: relative; flex-shrink: 0; }
    .donut-wrap svg { display: block; }
    .donut-center {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
    }
    .donut-center .dc-label { font-size: 11px; color: #57606a; }
    .donut-center .dc-val { font-size: 16px; font-weight: 700; color: #1e3a5f; }
    .legend { display: flex; flex-direction: column; gap: 10px; }
    .legend-item { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }

    /* ---- Table ---- */
    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    thead tr { background: #1e3a5f; color: #fff; }
    thead th {
      padding: 10px 12px;
      text-align: right;
      font-weight: 600;
      white-space: nowrap;
    }
    thead th:first-child { text-align: center; }
    tbody tr:nth-child(even) { background: #f7f8fa; }
    tbody tr:hover { background: #eff6ff; }
    tbody td {
      padding: 8px 12px;
      text-align: right;
      border-bottom: 1px solid #e5e7eb;
      white-space: nowrap;
    }
    tbody td:first-child { text-align: center; color: #57606a; }
    .td-principal  { color: #1e3a5f; font-weight: 600; }
    .td-interest   { color: #e05c2a; }
    .td-total      { font-weight: 700; }
    .td-cumulative { color: #7c5cd8; font-weight: 600; }
    .td-nisa       { color: #2a9d5c; font-weight: 600; }

    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .pagination button {
      padding: 6px 14px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      font-size: 13px;
      transition: background .15s;
    }
    .pagination button:hover:not(:disabled) { background: #eff6ff; border-color: #3b82d4; }
    .pagination button:disabled { opacity: .4; cursor: default; }
    .pagination .page-info { font-size: 13px; color: #57606a; min-width: 80px; text-align: center; }

    .placeholder {
      text-align: center;
      padding: 40px 20px;
      color: #57606a;
      font-size: 14px;
    }
    .placeholder svg { display: block; margin: 0 auto 12px; opacity: .25; }

    /* ---- Area chart tooltip ---- */
    .area-chart-wrap { position: relative; margin-top: 20px; overflow-x: auto; }
    .area-tooltip {
      position: absolute;
      background: #1e3a5f;
      color: #fff;
      font-size: 12px;
      line-height: 1.6;
      padding: 8px 12px;
      border-radius: 6px;
      pointer-events: none;
      white-space: nowrap;
      display: none;
      z-index: 10;
    }

    /* ---- Year selector ---- */
    .year-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 10px;
      max-height: 80px;
      overflow-y: auto;
    }
    .year-tab {
      padding: 4px 10px;
      border: 1px solid #d0d7de;
      border-radius: 20px;
      background: #fff;
      font-size: 11px;
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }
    .year-tab.active {
      background: #1e3a5f;
      border-color: #1e3a5f;
      color: #fff;
    }
    /* ---- Compare View ---- */
    .compare-outer {
      max-width: 1100px;
      margin: 32px auto;
      padding: 0 16px;
    }
    .compare-inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 24px;
    }
    @media (max-width: 700px) {
      .compare-inputs { grid-template-columns: 1fr; }
    }
    .compare-col-label {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 12px;
      padding: 6px 12px;
      border-radius: 6px;
      color: #fff;
    }
    .compare-col-label.label-a { background: #1e3a5f; }
    .compare-col-label.label-b { background: #a05a00; }
    .compare-btn-row {
      text-align: center;
      margin-bottom: 24px;
    }
    .compare-summaries {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 24px;
    }
    @media (max-width: 700px) {
      .compare-summaries { grid-template-columns: 1fr; }
    }
    .compare-card-a { border-top: 3px solid #1e3a5f !important; }
    .compare-card-b { border-top: 3px solid #c07020 !important; }

    /* ---- Tab Bar ---- */
    .tab-bar {
      background: #162d4a;
      display: flex;
      gap: 0;
      padding: 0 24px;
    }
    .tab-btn {
      padding: 12px 24px;
      background: transparent;
      border: none;
      color: #a8c4e0;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: color .2s, border-color .2s;
    }
    .tab-btn:hover { color: #fff; }
    .tab-btn.active {
      color: #fff;
      border-bottom-color: #3b82d4;
    }
  </style>
</head>
<body>

<header>
  <h1>住宅ローン計算機</h1>
  <p>借入条件を入力して月々の返済額をシミュレーションします</p>
</header>

<div class="tab-bar">
  <button class="tab-btn active" data-tab="single">シミュレーション</button>
  <button class="tab-btn" data-tab="compare">比較</button>
</div>

<div id="view-single">
<div class="container">
  <!-- ===== 左: 入力フォーム ===== -->
  <div class="card" id="form-card">
    <h2>借入条件の入力</h2>

    <div class="form-group">
      <label>借入金額</label>
      <div class="input-wrap">
        <input type="number" id="principal" value="3000" min="1" step="10" />
        <span class="input-unit">万円</span>
      </div>
    </div>

    <div class="form-group">
      <label>年利（固定金利）</label>
      <div class="input-wrap">
        <input type="number" id="rate" value="1.5" min="0.01" max="20" step="0.01" />
        <span class="input-unit">%</span>
      </div>
    </div>

    <div class="form-group">
      <label>返済期間</label>
      <div class="input-wrap">
        <input type="number" id="years" value="35" min="1" max="50" step="1" />
        <span class="input-unit">年</span>
      </div>
    </div>

    <div class="form-group">
      <label>返済方式</label>
      <div class="repay-type" id="repay-type">
        <label id="lbl-equal-installment">
          <input type="radio" name="repay" value="equal_installment" checked />
          <span>元利均等返済</span>
        </label>
        <label id="lbl-equal-principal">
          <input type="radio" name="repay" value="equal_principal" />
          <span>元金均等返済</span>
        </label>
      </div>
    </div>

    <div class="section-divider">NISA口座の設定</div>

    <div class="form-group">
      <label>現在のNISA残高</label>
      <div class="input-wrap">
        <input type="number" id="nisa-balance" value="0" min="0" step="10" />
        <span class="input-unit">万円</span>
      </div>
    </div>

    <div class="form-group">
      <label>毎月積立額</label>
      <div class="input-wrap">
        <input type="number" id="nisa-monthly" value="30000" min="0" step="1" />
        <span class="input-unit">円/月</span>
      </div>
    </div>

    <div class="form-group">
      <label>想定年利回り</label>
      <div class="input-wrap">
        <input type="number" id="nisa-rate" value="5.0" min="0" max="30" step="0.1" />
        <span class="input-unit">%</span>
      </div>
    </div>

    <button class="calc-btn" id="calc-btn">計算する</button>
  </div>

  <!-- ===== 右: 結果パネル ===== -->
  <div class="right-panel" id="result-panel">
    <div class="card" id="summary-card">
      <h2>返済サマリー</h2>
      <div id="summary-content">
        <div class="placeholder">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          条件を入力して「計算する」を押してください
        </div>
      </div>
    </div>

    <div class="card" id="schedule-card">
      <h2>返済スケジュール</h2>
      <div id="schedule-content">
        <div class="placeholder">計算結果がここに表示されます</div>
      </div>
    </div>
  </div>
</div>
</div><!-- /#view-single -->

<div id="view-compare" style="display:none">
  <div class="compare-outer">

    <!-- 上段: 入力欄 2列 -->
    <div class="compare-inputs">

      <!-- ケースA -->
      <div class="card compare-card-a">
        <div class="compare-col-label label-a">ケース A</div>
        <div class="form-group">
          <label>借入金額</label>
          <div class="input-wrap">
            <input type="number" id="principal-a" value="3000" min="1" step="10" />
            <span class="input-unit">万円</span>
          </div>
        </div>
        <div class="form-group">
          <label>年利（固定金利）</label>
          <div class="input-wrap">
            <input type="number" id="rate-a" value="1.5" min="0.01" max="20" step="0.01" />
            <span class="input-unit">%</span>
          </div>
        </div>
        <div class="form-group">
          <label>返済期間</label>
          <div class="input-wrap">
            <input type="number" id="years-a" value="35" min="1" max="50" step="1" />
            <span class="input-unit">年</span>
          </div>
        </div>
        <div class="form-group">
          <label>返済方式</label>
          <div class="repay-type" id="repay-type-a">
            <label id="lbl-a-ei">
              <input type="radio" name="repay-a" value="equal_installment" checked />
              <span>元利均等返済</span>
            </label>
            <label id="lbl-a-ep">
              <input type="radio" name="repay-a" value="equal_principal" />
              <span>元金均等返済</span>
            </label>
          </div>
        </div>

        <div class="section-divider">NISA口座の設定</div>

        <div class="form-group">
          <label>現在のNISA残高</label>
          <div class="input-wrap">
            <input type="number" id="nisa-balance-a" value="0" min="0" step="10" />
            <span class="input-unit">万円</span>
          </div>
        </div>
        <div class="form-group">
          <label>毎月積立額</label>
          <div class="input-wrap">
            <input type="number" id="nisa-monthly-a" value="30000" min="0" step="1" />
            <span class="input-unit">円/月</span>
          </div>
        </div>
        <div class="form-group">
          <label>想定年利回り</label>
          <div class="input-wrap">
            <input type="number" id="nisa-rate-a" value="5.0" min="0" max="30" step="0.1" />
            <span class="input-unit">%</span>
          </div>
        </div>
      </div>

      <!-- ケースB -->
      <div class="card compare-card-b">
        <div class="compare-col-label label-b">ケース B</div>
        <div class="form-group">
          <label>借入金額</label>
          <div class="input-wrap">
            <input type="number" id="principal-b" value="3000" min="1" step="10" />
            <span class="input-unit">万円</span>
          </div>
        </div>
        <div class="form-group">
          <label>年利（固定金利）</label>
          <div class="input-wrap">
            <input type="number" id="rate-b" value="2.0" min="0.01" max="20" step="0.01" />
            <span class="input-unit">%</span>
          </div>
        </div>
        <div class="form-group">
          <label>返済期間</label>
          <div class="input-wrap">
            <input type="number" id="years-b" value="35" min="1" max="50" step="1" />
            <span class="input-unit">年</span>
          </div>
        </div>
        <div class="form-group">
          <label>返済方式</label>
          <div class="repay-type" id="repay-type-b">
            <label id="lbl-b-ei">
              <input type="radio" name="repay-b" value="equal_installment" checked />
              <span>元利均等返済</span>
            </label>
            <label id="lbl-b-ep">
              <input type="radio" name="repay-b" value="equal_principal" />
              <span>元金均等返済</span>
            </label>
          </div>
        </div>

        <div class="section-divider">NISA口座の設定</div>

        <div class="form-group">
          <label>現在のNISA残高</label>
          <div class="input-wrap">
            <input type="number" id="nisa-balance-b" value="0" min="0" step="10" />
            <span class="input-unit">万円</span>
          </div>
        </div>
        <div class="form-group">
          <label>毎月積立額</label>
          <div class="input-wrap">
            <input type="number" id="nisa-monthly-b" value="30000" min="0" step="1" />
            <span class="input-unit">円/月</span>
          </div>
        </div>
        <div class="form-group">
          <label>想定年利回り</label>
          <div class="input-wrap">
            <input type="number" id="nisa-rate-b" value="5.0" min="0" max="30" step="0.1" />
            <span class="input-unit">%</span>
          </div>
        </div>
      </div>
    </div><!-- /.compare-inputs -->

    <!-- 比較ボタン -->
    <div class="compare-btn-row">
      <button class="calc-btn" id="compare-btn" style="width:auto;padding:12px 48px">比較する</button>
    </div>

    <!-- 中段: サマリー 2列 -->
    <div class="compare-summaries">
      <div class="card compare-card-a" id="summary-card-a">
        <h2>ケース A — 返済サマリー</h2>
        <div id="summary-a">
          <div class="placeholder">条件を入力して「比較する」を押してください</div>
        </div>
      </div>
      <div class="card compare-card-b" id="summary-card-b">
        <h2>ケース B — 返済サマリー</h2>
        <div id="summary-b">
          <div class="placeholder">条件を入力して「比較する」を押してください</div>
        </div>
      </div>
    </div><!-- /.compare-summaries -->

    <!-- 下段: グラフエリア -->
    <div id="compare-charts" style="display:none">
      <div class="card" style="margin-bottom:24px">
        <h2>残高推移の比較</h2>
        <div id="line-chart-wrap"></div>
      </div>
    </div>

  </div><!-- /.compare-outer -->
</div><!-- /#view-compare -->

<script>
  // ---- Radio ラベルの active 制御 ----
  // ---- タブ切り替え ----
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const tab = btn.dataset.tab;
      document.getElementById('view-single').style.display  = tab === 'single'  ? '' : 'none';
      document.getElementById('view-compare').style.display = tab === 'compare' ? '' : 'none';
    });
  });

  // ---- Radio ラベルの active 制御 (汎用: selector指定版) ----
  function initRadioStyle(groupSelector) {
    document.querySelectorAll(groupSelector + ' input[type="radio"]').forEach(radio => {
      radio.addEventListener('change', () => updateRadioStyleFor(groupSelector));
    });
    updateRadioStyleFor(groupSelector);
  }
  function updateRadioStyleFor(groupSelector) {
    document.querySelectorAll(groupSelector + ' label').forEach(lbl => lbl.classList.remove('active'));
    const checked = document.querySelector(groupSelector + ' input[type="radio"]:checked');
    if (checked) checked.closest('label').classList.add('active');
  }
  // シミュレーション用
  initRadioStyle('#repay-type');
  // 比較用
  initRadioStyle('#repay-type-a');
  initRadioStyle('#repay-type-b');

  // ---- 数値フォーマット ----
  const fmt = n => Math.round(n).toLocaleString('ja-JP');

  // ---- 元利均等返済 (毎月均等) ----
  function calcEqualInstallment(P, annualRate, months) {
    const r = annualRate / 12 / 100;
    const schedule = [];
    if (r === 0) {
      const monthly = P / months;
      let balance = P;
      for (let m = 1; m <= months; m++) {
        balance -= monthly;
        schedule.push({ month: m, principal: monthly, interest: 0, total: monthly, balance: Math.max(0, balance) });
      }
      return schedule;
    }
    const monthly = P * r * Math.pow(1 + r, months) / (Math.pow(1 + r, months) - 1);
    let balance = P;
    for (let m = 1; m <= months; m++) {
      const interest  = balance * r;
      const principal = monthly - interest;
      balance -= principal;
      schedule.push({ month: m, principal, interest, total: monthly, balance: Math.max(0, balance) });
    }
    return schedule;
  }

  // ---- 元金均等返済 (毎月の元金は一定) ----
  function calcEqualPrincipal(P, annualRate, months) {
    const r = annualRate / 12 / 100;
    const principalPerMonth = P / months;
    const schedule = [];
    let balance = P;
    for (let m = 1; m <= months; m++) {
      const interest = balance * r;
      const total    = principalPerMonth + interest;
      balance -= principalPerMonth;
      schedule.push({ month: m, principal: principalPerMonth, interest, total, balance: Math.max(0, balance) });
    }
    return schedule;
  }

  // ---- NISA 月次複利計算 ----
  function calcNisa(balance, monthly, annualRate, months) {
    const r = annualRate / 100;
    const values = [];
    let val = balance;
    for (let m = 1; m <= months; m++) {
      val += monthly;
      if (m % 12 === 0) val *= (1 + r);
      values.push(val);
    }
    return values;
  }

  // ---- ドーナツ SVG ----
  function buildDonut(principal, interest) {
    const total = principal + interest;
    const pPct  = principal / total;
    const R = 60, r = 38, cx = 70, cy = 70, size = 140;
    function polarToXY(cx, cy, R, angleDeg) {
      const a = (angleDeg - 90) * Math.PI / 180;
      return [cx + R * Math.cos(a), cy + R * Math.sin(a)];
    }
    function slice(startDeg, sweepDeg, color) {
      if (sweepDeg >= 360) sweepDeg = 359.99;
      const [x1, y1] = polarToXY(cx, cy, R, startDeg);
      const [x2, y2] = polarToXY(cx, cy, R, startDeg + sweepDeg);
      const [ix1, iy1] = polarToXY(cx, cy, r, startDeg);
      const [ix2, iy2] = polarToXY(cx, cy, r, startDeg + sweepDeg);
      const large = sweepDeg > 180 ? 1 : 0;
      return `<path d="M${x1},${y1} A${R},${R} 0 ${large},1 ${x2},${y2} L${ix2},${iy2} A${r},${r} 0 ${large},0 ${ix1},${iy1} Z" fill="${color}" />`;
    }
    const pSweep = pPct * 360;
    const iSweep = 360 - pSweep;
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      ${slice(0,        pSweep, '#1e3a5f')}
      ${slice(pSweep,   iSweep, '#e05c2a')}
    </svg>`;
  }

  // ---- 積み上げ面グラフ（ホバーツールチップ付き） ----
  let _areaChartCounter = 0;
  function buildStackedBar(schedule) {
    const id  = 'ac' + (++_areaChartCounter);
    const W = 560, H = 240;
    const ML = 62, MR = 12, MT = 14, MB = 36;
    const PW = W - ML - MR, PH = H - MT - MB;
    const N  = schedule.length;

    // 各月の値→SVG座標
    const maxVal = Math.max(...schedule.map(r => r.principal + r.interest));
    const xOf = i => ML + (i / (N - 1)) * PW;
    const yOf = v => MT + PH - (v / maxVal) * PH;

    // 積み上げ面パス: 利息（上）＋元金（下）
    // 下エリア: 元金（0→principal）
    const pPts  = schedule.map((r, i) => `${xOf(i)},${yOf(r.principal)}`).join(' ');
    const basePts = `${xOf(0)},${MT+PH} ${xOf(N-1)},${MT+PH}`;
    const principalArea = `M${xOf(0)},${MT+PH} ${schedule.map((r,i)=>`L${xOf(i)},${yOf(r.principal)}`).join(' ')} L${xOf(N-1)},${MT+PH} Z`;

    // 上エリア: 元金+利息 → 元金 のポリゴン
    const topPts    = schedule.map((r, i) => `${xOf(i)},${yOf(r.principal + r.interest)}`).join(' ');
    const bottomPts = schedule.map((r, i) => `${xOf(N-1-i)},${yOf(schedule[N-1-i].principal)}`).join(' ');
    const interestArea = `M${xOf(0)},${yOf(schedule[0].principal + schedule[0].interest)} `
      + schedule.map((r,i)=>`L${xOf(i)},${yOf(r.principal+r.interest)}`).join(' ')
      + ' ' + schedule.slice().reverse().map((r,i)=>`L${xOf(N-1-i)},${yOf(r.principal)}`).join(' ') + ' Z';

    // Y軸目盛り
    const yTicks = 4;
    let yLines = '';
    for (let i = 0; i <= yTicks; i++) {
      const val = maxVal / yTicks * i;
      const y   = yOf(val);
      const lbl = Math.round(val / 10000).toLocaleString('ja-JP') + '万';
      yLines += `<line x1="${ML}" y1="${y}" x2="${ML+PW}" y2="${y}" stroke="#e5e7eb" stroke-width="1"/>`;
      yLines += `<text x="${ML-4}" y="${y+4}" text-anchor="end" font-size="10" fill="#8a96a3">${lbl}</text>`;
    }

    // X軸ラベル（年単位）
    const totalYears = Math.ceil(N / 12);
    const xStep = totalYears <= 20 ? 5 : 10;
    let xLabels = '';
    for (let y = 0; y <= totalYears; y += xStep) {
      const mi = Math.min(y * 12, N - 1);
      const x  = xOf(mi);
      xLabels += `<text x="${x}" y="${MT+PH+16}" text-anchor="middle" font-size="10" fill="#8a96a3">${y}年</text>`;
    }
    if (totalYears % xStep !== 0) {
      xLabels += `<text x="${xOf(N-1)}" y="${MT+PH+16}" text-anchor="middle" font-size="10" fill="#8a96a3">${totalYears}年</text>`;
    }

    // 凡例
    const legY = MT + PH + 30;
    const legend = `
      <circle cx="${ML+10}" cy="${legY-3}" r="5" fill="#3b82d4"/>
      <text x="${ML+18}" y="${legY}" font-size="11" fill="#1f2328" font-weight="600">元金</text>
      <circle cx="${ML+54}" cy="${legY-3}" r="5" fill="#f59e42"/>
      <text x="${ML+62}" y="${legY}" font-size="11" fill="#1f2328" font-weight="600">利息</text>
    `;

    // ホバー用の不可視オーバーレイ列（各月分）
    const colW = PW / N;
    let cols = '';
    schedule.forEach((r, i) => {
      cols += `<rect class="ac-col" data-i="${i}" x="${xOf(i) - colW/2}" y="${MT}" width="${colW}" height="${PH}" fill="transparent" stroke="none"/>`;
    });

    const svgHtml = `
      <svg id="${id}-svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="max-width:100%;display:block;margin:0 auto;cursor:crosshair">
        ${yLines}
        <defs>
          <clipPath id="${id}-clip"><rect x="${ML}" y="${MT}" width="${PW}" height="${PH}"/></clipPath>
        </defs>
        <g clip-path="url(#${id}-clip)">
          <path d="${principalArea}" fill="#3b82d4" opacity="0.85"/>
          <path d="${interestArea}"  fill="#f59e42" opacity="0.85"/>
        </g>
        <line x1="${ML}" y1="${MT}" x2="${ML}" y2="${MT+PH}" stroke="#d0d7de" stroke-width="1"/>
        <line x1="${ML}" y1="${MT+PH}" x2="${ML+PW}" y2="${MT+PH}" stroke="#d0d7de" stroke-width="1"/>
        ${xLabels}${legend}
        <line id="${id}-cursor" x1="0" y1="${MT}" x2="0" y2="${MT+PH}" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="4,3" opacity="0" pointer-events="none"/>
        <g clip-path="url(#${id}-clip)">${cols}</g>
      </svg>
      <div id="${id}-tip" class="area-tooltip"></div>
    `;

    // JS初期化を次フレームで実行
    setTimeout(() => {
      const svg     = document.getElementById(id + '-svg');
      if (!svg) return;
      const cursor  = document.getElementById(id + '-cursor');
      const tip     = document.getElementById(id + '-tip');
      const wrap    = svg.parentElement;

      svg.querySelectorAll('.ac-col').forEach(col => {
        col.addEventListener('mouseenter', e => {
          const i   = parseInt(col.dataset.i);
          const row = schedule[i];
          const x   = parseFloat(col.getAttribute('x')) + parseFloat(col.getAttribute('width')) / 2;
          cursor.setAttribute('x1', x); cursor.setAttribute('x2', x);
          cursor.setAttribute('opacity', '1');

          const year  = Math.ceil(row.month / 12);
          tip.innerHTML =
            `<strong>${year}年目 / ${row.month}回目</strong><br>` +
            `元金: ${fmt(row.principal)} 円<br>` +
            `利息: ${fmt(row.interest)} 円<br>` +
            `返済額: ${fmt(row.total)} 円`;

          // SVG上の座標→wrap上のpx座標に変換
          const svgRect  = svg.getBoundingClientRect();
          const wrapRect = wrap.getBoundingClientRect();
          const svgW     = svg.viewBox.baseVal.width;
          const scaleX   = svgRect.width / svgW;
          const px       = (x * scaleX) + (svgRect.left - wrapRect.left);
          const tipW     = 170;
          const left     = Math.min(px + 10, wrapRect.width - tipW - 4);
          tip.style.left    = left + 'px';
          tip.style.top     = '4px';
          tip.style.display = 'block';
        });
        col.addEventListener('mouseleave', () => {
          cursor.setAttribute('opacity', '0');
          tip.style.display = 'none';
        });
      });
    }, 0);

    return `<div class="area-chart-wrap" id="${id}-wrap">${svgHtml}</div>`;
  }

  // シミュレーション: ボタン＋入力変更でリアルタイム実行

          </div>
          <div class="legend-item">
            <div class="legend-dot" style="background:#e05c2a"></div>
            <div>
              <div style="font-weight:600">利息</div>
              <div style="color:#57606a;font-size:12px">${fmt(totalInterest)}円（${(totalInterest/totalPay*100).toFixed(1)}%）</div>
            </div>
          </div>
        </div>
      </div>
      ${buildStackedBar(schedule)}
    `;
    document.getElementById(targetId).innerHTML = html;
  }

  // ---- 残高推移 折れ線グラフ (純SVG) ----
  function buildLineChart(scheduleA, scheduleB, labelA, labelB) {
    const W = 680, H = 320;
    const ML = 74, MR = 20, MT = 20, MB = 48;
    const PW = W - ML - MR, PH = H - MT - MB;

    // 年次サンプリング（0年目=初期値, 以降12ヶ月ごと）
    function sampleBalances(schedule) {
      const pts = [schedule[0].balance + schedule[0].principal]; // 初期残高(月0)
      for (let m = 11; m < schedule.length; m += 12) pts.push(schedule[m].balance);
      return pts;
    }

    const bA = sampleBalances(scheduleA);
    const bB = sampleBalances(scheduleB);
    const maxYears = Math.max(bA.length, bB.length) - 1;
    const maxVal   = Math.max(...bA, ...bB);

    // スケール
    const xScale = i => ML + (i / maxYears) * PW;
    const yScale = v => MT + PH - (v / maxVal) * PH;

    // 軸ラベル: Y軸（万円）
    const yTicks = 5;
    let yAxisLines = '';
    for (let i = 0; i <= yTicks; i++) {
      const val = (maxVal / yTicks) * i;
      const y   = yScale(val);
      const label = Math.round(val / 10000).toLocaleString('ja-JP');
      yAxisLines += `<line x1="${ML}" y1="${y}" x2="${ML + PW}" y2="${y}" stroke="#e5e7eb" stroke-width="1"/>`;
      yAxisLines += `<text x="${ML - 6}" y="${y + 4}" text-anchor="end" font-size="11" fill="#57606a">${label}</text>`;
    }

    // X軸ラベル（年）
    const xStep = maxYears <= 20 ? 5 : 10;
    let xAxisLabels = '';
    for (let y = 0; y <= maxYears; y += xStep) {
      const x = xScale(y);
      xAxisLabels += `<line x1="${x}" y1="${MT}" x2="${x}" y2="${MT + PH}" stroke="#e5e7eb" stroke-width="1"/>`;
      xAxisLabels += `<text x="${x}" y="${MT + PH + 18}" text-anchor="middle" font-size="11" fill="#57606a">${y}年</text>`;
    }
    // 最終年ラベルが含まれない場合
    if (maxYears % xStep !== 0) {
      const x = xScale(maxYears);
      xAxisLabels += `<text x="${x}" y="${MT + PH + 18}" text-anchor="middle" font-size="11" fill="#57606a">${maxYears}年</text>`;
    }

    // 折れ線パスを生成
    function toPolyline(balances, color) {
      const pts = balances.map((v, i) => `${xScale(i)},${yScale(v)}`).join(' ');
      return `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    }

    // 凡例
    const legendY = MT + PH + 38;
    const legendAX = ML + PW / 2 - 120;
    const legendBX = ML + PW / 2 + 20;
    const legend = `
      <line x1="${legendAX}" y1="${legendY}" x2="${legendAX + 24}" y2="${legendY}" stroke="#1e3a5f" stroke-width="2.5"/>
      <text x="${legendAX + 30}" y="${legendY + 4}" font-size="12" fill="#1e3a5f" font-weight="600">${labelA}</text>
      <line x1="${legendBX}" y1="${legendY}" x2="${legendBX + 24}" y2="${legendY}" stroke="#c07020" stroke-width="2.5"/>
      <text x="${legendBX + 30}" y="${legendY + 4}" font-size="12" fill="#c07020" font-weight="600">${labelB}</text>
    `;

    // Y軸タイトル
    const yTitle = `<text transform="rotate(-90)" x="${-(MT + PH/2)}" y="14" text-anchor="middle" font-size="11" fill="#57606a">残高（万円）</text>`;

    return `
      <div style="overflow-x:auto">
        <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="max-width:100%;display:block;margin:0 auto">
          ${yTitle}
          ${yAxisLines}
          ${xAxisLabels}
          <line x1="${ML}" y1="${MT}" x2="${ML}" y2="${MT + PH}" stroke="#d0d7de" stroke-width="1"/>
          <line x1="${ML}" y1="${MT + PH}" x2="${ML + PW}" y2="${MT + PH}" stroke="#d0d7de" stroke-width="1"/>
          ${toPolyline(bA, '#1e3a5f')}
          ${toPolyline(bB, '#c07020')}
          ${legend}
        </svg>
      </div>
    `;
  }

  // ---- 比較計算 ----
  function runCompare() {
    const PA    = parseFloat(document.getElementById('principal-a').value) * 10000;
    const rateA = parseFloat(document.getElementById('rate-a').value);
    const yrsA  = parseInt(document.getElementById('years-a').value, 10);
    const repA  = document.querySelector('#repay-type-a input[type="radio"]:checked').value;

    const PB    = parseFloat(document.getElementById('principal-b').value) * 10000;
    const rateB = parseFloat(document.getElementById('rate-b').value);
    const yrsB  = parseInt(document.getElementById('years-b').value, 10);
    const repB  = document.querySelector('#repay-type-b input[type="radio"]:checked').value;

    if (isNaN(PA) || PA <= 0 || isNaN(rateA) || rateA < 0 || isNaN(yrsA) || yrsA < 1) return;
    if (isNaN(PB) || PB <= 0 || isNaN(rateB) || rateB < 0 || isNaN(yrsB) || yrsB < 1) return;

    const schA = repA === 'equal_installment'
      ? calcEqualInstallment(PA, rateA, yrsA * 12)
      : calcEqualPrincipal(PA, rateA, yrsA * 12);
    const schB = repB === 'equal_installment'
      ? calcEqualInstallment(PB, rateB, yrsB * 12)
      : calcEqualPrincipal(PB, rateB, yrsB * 12);

    // NISA計算
    const nisaBalA  = (parseFloat(document.getElementById('nisa-balance-a').value) || 0) * 10000;
    const nisaMonA  = parseFloat(document.getElementById('nisa-monthly-a').value) || 0;
    const nisaRateA = parseFloat(document.getElementById('nisa-rate-a').value) || 0;
    const valsA = calcNisa(nisaBalA, nisaMonA, nisaRateA, yrsA * 12);
    schA.forEach((row, i) => { row.nisaValue = valsA[i]; });

    const nisaBalB  = (parseFloat(document.getElementById('nisa-balance-b').value) || 0) * 10000;
    const nisaMonB  = parseFloat(document.getElementById('nisa-monthly-b').value) || 0;
    const nisaRateB = parseFloat(document.getElementById('nisa-rate-b').value) || 0;
    const valsB = calcNisa(nisaBalB, nisaMonB, nisaRateB, yrsB * 12);
    schB.forEach((row, i) => { row.nisaValue = valsB[i]; });

    renderCompareSummary(schA, PA, repA, 'summary-a', '#1e3a5f',
      { hasNisa: true, balance: nisaBalA, monthly: nisaMonA });
    renderCompareSummary(schB, PB, repB, 'summary-b', '#c07020',
      { hasNisa: true, balance: nisaBalB, monthly: nisaMonB });

    // 折れ線グラフ
    const labelA = `A: ${Math.round(PA/10000)}万円 ${rateA}% ${yrsA}年`;
    const labelB = `B: ${Math.round(PB/10000)}万円 ${rateB}% ${yrsB}年`;
    document.getElementById('line-chart-wrap').innerHTML = buildLineChart(schA, schB, labelA, labelB);
    document.getElementById('compare-charts').style.display = '';
  }

  // 比較: ボタン＋入力変更でリアルタイム実行
  document.getElementById('compare-btn').addEventListener('click', runCompare);
  ['principal-a','rate-a','years-a','nisa-balance-a','nisa-monthly-a','nisa-rate-a',
   'principal-b','rate-b','years-b','nisa-balance-b','nisa-monthly-b','nisa-rate-b'].forEach(id => {
    document.getElementById(id).addEventListener('input', runCompare);
  });
  document.querySelectorAll('#repay-type-a input[type="radio"], #repay-type-b input[type="radio"]').forEach(r => {
    r.addEventListener('change', runCompare);
  });
</script>
</body>
</html>
